name: Deploy Web
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install --legacy-peer-deps
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel --prod --yes --token "$VERCEL_TOKEN" || echo "Deploy skipped"
      - name: Run database migrations
        run: |
          sleep 5
          curl -s -X POST "https://my-project-five-sepia.vercel.app/api/admin/migrate" \
            -H "Cookie: ep_role=ADMIN; ep_sid=${{ secrets.ADMIN_SESSION_ID }}" \
            || echo "Migration skipped"
