name: Build APK
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('student-app-rust/android-wrapper/**/*.gradle*', 'student-app-rust/android-wrapper/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d $HOME
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH
      - run: gradle assembleDebug --no-daemon --build-cache --parallel
        working-directory: student-app-rust/android-wrapper
      - name: Rename APK with version
        run: |
          mv student-app-rust/android-wrapper/app/build/outputs/apk/debug/app-debug.apk \
             student-app-rust/android-wrapper/app/build/outputs/apk/debug/dreamkorea-v3.3.0-debug.apk
      # Upload as a GitHub Release asset — Releases storage is UNLIMITED for
      # public repos and doesn't count against the Actions artifact quota
      # (which we've already hit).
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.3.0-${{ github.run_number }}
          name: DreamKorea v3.3.0 (Build ${{ github.run_number }})
          body: |
            ## What's new in v3.3.0

            ### Login screen
            - **Three tabs: Sign In / Sign Up / Forgot Password** (default: Sign In)
            - Sign Up: name + email + phone + password (no OTP needed)
            - Forgot Password: enter email → get 6-digit code → reset password

            ### QBank Sets
            - Admin can group questions into Set 1, 2, 3, 4, 5 within a single QBank test
            - Set selector (purple pills) at the top of the QBank editor

            ### Make a Copy
            - Every test card has a "Copy" button — duplicates the whole test
              + all questions into another category (exam/demo/batch/chapter/qbank)
            - QBank tests also have "Copy Set" — copies one set's questions
              into another existing test

            ### Eye Vision auto-trigger
            - After exam submission, if the student scored below 70%
              (mistakes > 30%), an orange "Eye Vision Check Recommended"
              card appears on the result screen with a "Take N Tests" button
            - More mistakes → more tests (3-5); fewer mistakes → fewer (0-2)

            ### Block toggle (admin)
            - Each exam/demo card has inline Text/Audio pills to enable/disable
              a block per exam — disabled blocks hide from students entirely

            ### Bug fixes
            - Next button is now clickable in horizontal mode (was being pushed
              off-screen by fillMaxHeight() LazyColumns)
            - QBank in app now matches admin (both list question_bank TESTS)
            - Drafts auto-save — questions don't vanish on misclick

            SHA: ${{ github.sha }}
          files: |
            student-app-rust/android-wrapper/app/build/outputs/apk/debug/dreamkorea-v3.3.0-debug.apk
          draft: false
          prerelease: false
