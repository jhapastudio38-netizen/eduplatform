name: Build APK
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('student-app-rust/android-wrapper/**/*.gradle*', 'student-app-rust/android-wrapper/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d $HOME
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH
      - run: gradle assembleDebug --no-daemon --build-cache --parallel
        working-directory: student-app-rust/android-wrapper
      - name: Rename APK with version
        run: |
          mv student-app-rust/android-wrapper/app/build/outputs/apk/debug/app-debug.apk \
             student-app-rust/android-wrapper/app/build/outputs/apk/debug/dreamkorea-v8.0.0-debug.apk
      # Upload as a GitHub Release asset — Releases storage is UNLIMITED for
      # public repos and doesn't count against the Actions artifact quota.
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0.0-${{ github.run_number }}
          name: DreamKorea v8.0.0 (Build ${{ github.run_number }})
          body: |
            ## What's new in v8.0.0

            ### Bundle-combined exams (QBank + Batch packages)
            - Admin can now create a Question Bank bundle and pick tests from
              ANY category (batch, exam, demo, chapter, etc.). The system
              extracts all questions from those tests and combines them into
              ONE combined exam the student solves like a normal exam.
            - Admin can create a Batch bundle that ONLY accepts batch-category
              tests. Same combined-exam flow.
            - Student opens Question Bank or Batch Packages from home → sees
              bundle cards with title + description + "View All Questions"
              button → opens the combined exam.
            - Tapping "View All Questions" loads the combined exam in the
              standard exam-taking screen (landscape mode, status bar,
              Nepali nav, etc.).

            ### Completed exam tracking
            - After the student submits any exam (including combined exams),
              it's marked as completed.
            - The bundle card shows a green "Completed" badge with the score
              once the student has submitted.
            - The "View All Questions" button changes to "Solve Again" if
              completed, so the student can re-attempt.

            ### Bug fixes
            - Submitting a combined exam (qbank-combined or bundle-{id}) no
              longer fails with a 500 error. The submit endpoint now handles
              synthetic test IDs by looking up questions directly.
            - A virtual Test row is created on first combined-exam submission
              to satisfy the Submission.testId FK constraint.
            - SubmitResponse now includes a `completed: Boolean` flag.

            SHA: ${{ github.sha }}
          files: |
            student-app-rust/android-wrapper/app/build/outputs/apk/debug/dreamkorea-v8.0.0-debug.apk
          draft: false
          prerelease: false
