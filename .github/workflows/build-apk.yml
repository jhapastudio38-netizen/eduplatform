name: Build APK
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('student-app-rust/android-wrapper/**/*.gradle*', 'student-app-rust/android-wrapper/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d $HOME
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH
      - run: gradle assembleDebug --no-daemon --build-cache --parallel
        working-directory: student-app-rust/android-wrapper
      - name: Rename APK with version
        run: |
          mv student-app-rust/android-wrapper/app/build/outputs/apk/debug/app-debug.apk \
             student-app-rust/android-wrapper/app/build/outputs/apk/debug/dreamkorea-v3.2.1-debug.apk
      # Upload as a GitHub Release asset — Releases storage is UNLIMITED for
      # public repos and doesn't count against the Actions artifact quota
      # (which we've already hit).
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2.1-${{ github.run_number }}
          name: DreamKorea v3.2.1 (Build ${{ github.run_number }})
          body: |
            ## What's new in v3.2.1

            - **Fixed: Next button now clickable in horizontal mode.** The
              inner LazyColumns no longer use fillMaxHeight() which was
              pushing the bottom button bar off-screen.
            - **QBank in app now matches admin.** The student Question Bank
              screen now lists QBank TESTS (created in admin under
              "Question Bank"), not standalone practice questions that were
              never created. Tapping a QBank test opens the same
              auto-landscape + block-grid flow as a regular exam.
            - All exams, QBank tests, and packages flow through the same
              ExamEntryScreen (briefing card → auto-landscape → block grid).

            SHA: ${{ github.sha }}
          files: |
            student-app-rust/android-wrapper/app/build/outputs/apk/debug/dreamkorea-v3.2.1-debug.apk
          draft: false
          prerelease: false
