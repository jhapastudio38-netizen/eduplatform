name: Build APK
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('student-app-rust/android-wrapper/**/*.gradle*', 'student-app-rust/android-wrapper/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d $HOME
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH
      - run: gradle assembleDebug --no-daemon --build-cache --parallel
        working-directory: student-app-rust/android-wrapper

      # Read versionName + versionCode from build.gradle.kts
      - name: Read version
        id: ver
        run: |
          VGREP=$(grep versionName student-app-rust/android-wrapper/app/build.gradle.kts | head -1)
          CGREP=$(grep versionCode student-app-rust/android-wrapper/app/build.gradle.kts | head -1)
          VNAME=$(echo "$VGREP" | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          VCODE=$(echo "$CGREP" | sed -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/')
          echo "version_name=$VNAME" >> $GITHUB_OUTPUT
          echo "version_code=$VCODE" >> $GITHUB_OUTPUT
          echo "Detected version: $VNAME (code $VCODE)"

      - name: Rename APK with version
        run: |
          mv student-app-rust/android-wrapper/app/build/outputs/apk/debug/app-debug.apk \
             student-app-rust/android-wrapper/app/build/outputs/apk/debug/dreamkorea-v${{ steps.ver.outputs.version_name }}-debug.apk

      # ALWAYS upload as workflow artifact — downloadable even if release step fails.
      # Artifacts expire after 90 days, but they're a guaranteed fallback.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamkorea-v${{ steps.ver.outputs.version_name }}-apk
          path: student-app-rust/android-wrapper/app/build/outputs/apk/debug/dreamkorea-v${{ steps.ver.outputs.version_name }}-debug.apk
          retention-days: 90
          if-no-files-found: error

      # Create a GitHub Release with the correct version tag.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version_name }}-${{ github.run_number }}
          name: DreamKorea v${{ steps.ver.outputs.version_name }} (Build ${{ github.run_number }})
          body: |
            ## DreamKorea v${{ steps.ver.outputs.version_name }}

            Build #${{ github.run_number }} • versionCode ${{ steps.ver.outputs.version_code }}

            Commit: ${{ github.sha }}

            Download the APK below and install on your Android device.
          files: |
            student-app-rust/android-wrapper/app/build/outputs/apk/debug/dreamkorea-v${{ steps.ver.outputs.version_name }}-debug.apk
          draft: false
          prerelease: false
          make_latest: true
