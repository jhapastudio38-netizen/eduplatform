name: Build APK
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('student-app-rust/android-wrapper/**/*.gradle*', 'student-app-rust/android-wrapper/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d $HOME
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH
      - run: gradle assembleDebug --no-daemon --build-cache --parallel
        working-directory: student-app-rust/android-wrapper
      - name: Rename APK with version
        run: |
          mv student-app-rust/android-wrapper/app/build/outputs/apk/debug/app-debug.apk \
             student-app-rust/android-wrapper/app/build/outputs/apk/debug/dreamkorea-v3.8.0-debug.apk
      # Upload as a GitHub Release asset — Releases storage is UNLIMITED for
      # public repos and doesn't count against the Actions artifact quota
      # (which we've already hit).
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.8.0-${{ github.run_number }}
          name: DreamKorea v3.8.0 (Build ${{ github.run_number }})
          body: |
            ## What's fixed in v3.8.0

            ### Real-time data
            - App now fetches fresh data on every screen open (Books, Exams, QBank,
              Packages) — no more 2-minute stale cache. Books published in admin
              appear in the app immediately on next screen open.
            - Cache TTL reduced from 2 min to 30 sec, and screens invalidate cache
              before loading so admin changes show up instantly.

            ### Login
            - Sign Up tab: name + email + phone + password (NO OTP step).
              Password is set immediately on signup, no second OTP screen.
            - Sign In tab: email + password.
            - Forgot Password tab: enter email → get 6-digit code → reset password.

            ### Duplicate button (admin)
            - Every exam/demo/batch/chapter/qbank card has a "Duplicate" button
              (was "Copy"). Click it → opens a proper dialog with:
                • Editable new title (default "{Original} (Copy)")
                • Target category dropdown (exam/demo/batch/chapter/qbank)
                • Optional package dropdown — duplicated test auto-added to the
                  selected package
              Questions, blocks, audio settings, and all other content stay the same.

            ### Copy All / Paste All (admin)
            - New "Copy All" button in the exam editor — copies ALL questions
              in the current test into a single bulk code (DK-ALL-XXXX-YYYY).
            - Paste button now detects single vs. bulk codes automatically:
                • Single code (DK-TEXT-1-XXXX) → pastes one question
                • Bulk code (DK-ALL-XXXX-YYYY) → pastes ALL questions with new
                  block numbers so they append without overwriting
            - Codes are stored in localStorage and can be shared between tests.

            SHA: ${{ github.sha }}
          files: |
            student-app-rust/android-wrapper/app/build/outputs/apk/debug/dreamkorea-v3.8.0-debug.apk
          draft: false
          prerelease: false
